name: Build and Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Prevent two releases from being generated simultaneously.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------
  # 1. Calculate the next version and create the git tag
  # ---------------------------------------------------------
  version:
    name: Calculate Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Calculate next version
        id: version
        shell: bash
        run: |
          set -e

          latest=$(git tag --list \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' \
            | sort -V \
            | tail -n 1)

          if [ -z "$latest" ]; then
            version="1.0.0"
          else
            major=$(echo "$latest" | cut -d. -f1)
            version="$((major + 1)).0.0"
          fi

          echo "Latest version: ${latest:-none}"
          echo "New version: $version"

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push version tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$VERSION"
          git push origin "$VERSION"

  # ---------------------------------------------------------
  # 2. Build Windows
  # ---------------------------------------------------------
  build-windows:
    name: Build Windows
    needs: version
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only upload actual distributable files.
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  # ---------------------------------------------------------
  # 3. Build Linux
  # ---------------------------------------------------------
  build-linux:
    name: Build Linux
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux installer
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only upload actual distributable files.
      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.rpm
            dist/*.snap
            dist/latest-linux.yml
          if-no-files-found: error

  # ---------------------------------------------------------
  # 4. Build macOS
  # ---------------------------------------------------------
  build-macos:
    name: Build macOS
    needs: version
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS installer
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only upload actual distributable files.
      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  # ---------------------------------------------------------
  # 5. Create GitHub Release
  # ---------------------------------------------------------
  release:
    name: Create GitHub Release
    needs:
      - version
      - build-windows
      - build-linux
      - build-macos

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: linux-installer
          path: release

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: release

      - name: Show release files
        run: |
          echo "Files that will be uploaded:"
          find release -type f -maxdepth 2 -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/*.deb
            release/*.AppImage
            release/*.rpm
            release/*.snap
            release/*.dmg
            release/*.dmg.blockmap
            release/latest.yml
            release/latest-linux.yml
            release/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}